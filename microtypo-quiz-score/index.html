<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MicroTypo Score</title>
<link rel="stylesheet" href="/assets/fonts/webcm/webcm.css">
<style>
    /* Contrôle des codes de vérification des quiz MicroTypo (page non référencée).
       Le code reçu par mail est recalculé avec la clé de l'enseignant (gardée dans ce navigateur seulement) :
       il donne le nom et le score, ou « Code invalide » si une seule lettre a été changée. */
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "WebCM Serif 10", "Latin Modern Roman", serif; font-size: 19px; line-height: 25px; color: black; text-align: center; }
    .title { display: inline-block; margin: 52px 0 0; padding: 7px 14px 9px; border-radius: 4px; background: black; color: white;
             font-size: 31px; line-height: 35px; font-style: italic; }
    .frame { box-sizing: border-box; margin: 30px; padding: 30px; border: 2px solid lightgrey; border-radius: 48px; text-align: left; }
    label { display: block; margin: 0 0 10px; color: darkgrey; }
    input, textarea { box-sizing: border-box; width: 100%; margin: 0 0 30px; padding: 10px 16px; font: inherit; font-size: 23px; line-height: 30px;
                      border: 2px solid lightgrey; border-radius: 24px; outline: none; background: transparent; }
    input:focus, textarea:focus { border-color: darkgrey; }
    textarea { height: 200px; resize: vertical; white-space: pre; }
    .pill { font: inherit; font-size: 26px; line-height: 35px; min-height: 51px; padding: 6px 14px 10px; border: 0; border-radius: 4px;
            color: white; background: darkgrey; cursor: pointer; }
    .pill:hover { background: black; }
    #key-msg { margin: -20px 0 30px; color: darkgrey; }
    #key-msg.bad { color: rgb(255, 0, 0); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid lightgrey; text-align: left; vertical-align: top; }
    th { color: darkgrey; font-weight: normal; }
    .num { text-align: right; white-space: nowrap; }
    td.code { font-size: 15px; color: darkgrey; word-break: break-all; }
    tr.bad td { color: rgb(255, 0, 0); }
    tr.ok td:first-child::before { content: "✓ "; color: rgb(0, 170, 60); }
</style>
</head>
<body>
<div class="title">MicroTypo Score</div>

<div class="frame">
    <div id="key-box">
        <label for="key">Clé de l’enseignant (dans les éditeurs privés, constante <i>QUIZ_KEY</i>) — gardée dans ce navigateur seulement</label>
        <input id="key" type="password" autocomplete="off" spellcheck="false">
        <p id="key-msg"></p>
    </div>
    <label for="codes">Codes reçus par mail (un par ligne)</label>
    <textarea id="codes" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <table id="out" hidden>
        <thead><tr><th>Nom</th><th>Quiz</th><th class="num">Score</th><th class="num">Note</th><th>Code</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const KEY_CHECK = "91dead9ed4f33fce";          // empreinte de la bonne clé (la clé elle-même n'est pas dans la page)
const STORE = "microtypo-score-key";
const B32 = "0123456789abcdefghjkmnpqrstvwxyz";
const UNLEET = { "4": "a", "3": "e", "1": "i", "0": "o" };
const M50 = (1n << 50n) - 1n;

async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}
let key = "", keyOk = false;
async function setKey(k) {
    key = k.trim().toLowerCase();
    keyOk = key !== "" && (await sha256(await sha256(key))).slice(0, 16) === KEY_CHECK;
    $("key-msg").className = keyOk || !key ? "" : "bad";
    $("key-msg").textContent = !key ? "" : keyOk ? "Clé correcte." : "Clé incorrecte.";
    if (keyOk) { try { localStorage.setItem(STORE, key); } catch (e) {} }
    run();
}

// questions de chaque quiz : lues dans la page du quiz (nombre total, pour la note)
const quizzes = {};
async function totalOf(q) {
    if (!(q in quizzes)) {
        quizzes[q] = fetch("/microtypo-quiz-" + q + "/").then(r => r.ok ? r.text() : "").then(t => {
            const m = t.match(/const QUESTIONS = (\[.*?\]);\n/s);
            return m ? JSON.parse(m[1]).length : 0;
        }).catch(() => 0);
    }
    return quizzes[q];
}

function readCode(code) {
    const m = code.trim().toLowerCase().match(/^(\d+)-([a-z0-9_]+)-([0-9a-z]+)-([0-9a-z]{10})$/);
    if (!m || [...m[3] + m[4]].some(c => !B32.includes(c))) return null;
    const name = [...m[2]].reverse().map(c => UNLEET[c] || c).join("").replace(/_/g, " ")
        .replace(/(^|\s)([a-z])/g, (x, a, c) => a + c.toUpperCase());
    const ids = [];
    [...m[3]].forEach((c, k) => {
        const v = B32.indexOf(c);
        for (let b = 0; b < 5; b++) if (v & (16 >> b)) ids.push(k * 5 + b + 1);
    });
    let x = 0n;
    for (const c of m[4]) x = (x << 5n) | BigInt(B32.indexOf(c));
    return { quiz: +m[1], nc: m[2], name, ids, x };
}
async function verify(r) {
    let x = 0n;
    for (const id of r.ids) {
        const secret = (await sha256(key + "|microtypo" + r.quiz + "|" + id)).slice(0, 32);
        x ^= BigInt("0x" + (await sha256(secret + "|" + r.nc)).slice(0, 13)) & M50;
    }
    return x === r.x;
}

let runId = 0;
async function run() {
    const id = ++runId;
    const lines = $("codes").value.split("\n").map(l => l.trim()).filter(Boolean);
    const rows = [];
    for (const line of lines) {
        const r = readCode(line);
        const ok = r && keyOk && await verify(r);
        const total = r ? await totalOf(r.quiz) : 0;
        rows.push({ line, r, ok, total });
    }
    if (id !== runId) return;
    const tb = $("out").querySelector("tbody");
    tb.textContent = "";
    for (const { line, r, ok, total } of rows) {
        const tr = document.createElement("tr");
        const cells = [];
        if (!keyOk) { tr.className = "bad"; cells.push("Clé manquante ou incorrecte", "", "", ""); }
        else if (!ok) { tr.className = "bad"; cells.push("Code invalide", r ? "MicroTypo " + r.quiz : "", "", ""); }
        else {
            tr.className = "ok";
            const note = total ? (Math.round((1 + 5 * r.ids.length / total) * 10) / 10).toFixed(1).replace(".", ",") : "?";
            cells.push(r.name, "MicroTypo " + r.quiz, r.ids.length + " / " + (total || "?"), note);
        }
        cells.push(line);
        cells.forEach((c, k) => {
            const td = document.createElement("td");
            td.textContent = c;
            if (k === 2 || k === 3) td.className = "num";
            if (k === 4) td.className = "code";
            tr.appendChild(td);
        });
        tb.appendChild(tr);
    }
    $("out").hidden = !rows.length;
}

$("key").addEventListener("input", e => setKey(e.target.value));
$("codes").addEventListener("input", run);
try { const k = localStorage.getItem(STORE); if (k) { $("key").value = k; setKey(k); } } catch (e) {}
})();
</script>
</body>
</html>
