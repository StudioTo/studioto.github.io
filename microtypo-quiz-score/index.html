<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MicroTypo Score</title>
<link rel="stylesheet" href="/assets/fonts/webcm/webcm.css">
<style>
    /* Contrôle d'un code de vérification MicroTypo (page non référencée).
       On colle le code d'un élève : la page le recalcule avec la clé de l'enseignant (gardée dans ce navigateur
       seulement) et affiche ce que l'élève a vu à la fin de sa partie (nom, score, note), ou « Code invalide ». */
    html, body { margin: 0; height: 100%; }
    body { font-family: "WebCM Serif 10", "Latin Modern Roman", serif; color: black; text-align: center; }
    .frame { position: absolute; inset: 30px; border: 2px solid lightgrey; border-radius: 48px; display: flex; flex-direction: column; align-items: center; }
    .title { margin-top: 20px; padding: 7px 14px 9px; border-radius: 4px; background: black; color: white; font-size: 31px; line-height: 35px; font-style: italic; }
    input { box-sizing: border-box; width: min(720px, calc(100% - 80px)); margin-top: 20px; padding: 10px 16px; font: inherit; font-size: 23px; line-height: 30px;
            text-align: center; border: 2px solid lightgrey; border-radius: 26px; outline: none; background: transparent; }
    input:focus { border-color: darkgrey; }
    input::placeholder { color: darkgrey; }
    #key { width: min(420px, calc(100% - 80px)); }
    #key-msg { margin: 10px 0 0; font-size: 19px; line-height: 23px; color: rgb(255, 0, 0); min-height: 23px; }
    /* résultat : comme l'écran final du quiz */
    #result { flex: 1; display: flex; flex-direction: column; justify-content: center; font-size: 60px; }
    #result p { margin: 0; line-height: 1.2; }
    #result #r-name { font-style: italic; margin-bottom: 1.2em; }   /* une ligne vide après le nom, comme à la fin du quiz */
    #result #r-quiz { font-size: 23px; line-height: 30px; color: darkgrey; margin-top: 30px; }
    #result.bad p { color: rgb(255, 0, 0); }
    .thin { display: inline-block; width: 0.16em; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="frame">
    <div class="title">MicroTypo Score</div>
    <div id="key-box">
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Clé de l’enseignant">
        <p id="key-msg"></p>
    </div>
    <input id="code" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Code de l’élève">
    <div id="result">
        <p id="r-name"></p>
        <p id="r-score"></p>
        <p id="r-quiz"></p>
    </div>
</div>

<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const KEY_CHECK = "91dead9ed4f33fce";          // empreinte de la bonne clé (la clé elle-même n'est pas dans la page)
const STORE = "microtypo-score-key";
const B32 = "0123456789abcdefghjkmnpqrstvwxyz";
const UNLEET = { "4": "a", "3": "e", "1": "i", "0": "o" };
const M50 = (1n << 50n) - 1n;
const THIN = '<span class="thin"></span>';

async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}
let key = "", keyOk = false;
async function setKey(k, fromStore) {
    key = k.trim().toLowerCase();
    keyOk = key !== "" && (await sha256(await sha256(key))).slice(0, 16) === KEY_CHECK;
    $("key-msg").textContent = key && !keyOk ? "Clé incorrecte." : "";
    if (keyOk) {
        try { localStorage.setItem(STORE, key); } catch (e) {}
        $("key-box").hidden = true;           // clé connue : seul le champ du code reste
        if (!fromStore) $("code").focus();
    }
    run();
}

// nombre de questions du quiz : lu dans la page du quiz (pour la note, comme à la fin de la partie)
const totals = {};
function totalOf(q) {
    if (!(q in totals)) {
        totals[q] = fetch("/microtypo-quiz-" + q + "/").then(r => r.ok ? r.text() : "").then(t => {
            const m = t.match(/const QUESTIONS = (\[.*?\]);\n/s);
            return m ? JSON.parse(m[1]).length : 0;
        }).catch(() => 0);
    }
    return totals[q];
}

function readCode(code) {
    const m = code.trim().toLowerCase().match(/^(\d+)-([a-z0-9_]+)-([0-9a-z]+)-([0-9a-z]{10})$/);
    if (!m || [...m[3] + m[4]].some(c => !B32.includes(c))) return null;
    const name = [...m[2]].reverse().map(c => UNLEET[c] || c).join("").replace(/_/g, " ")
        .replace(/(^|\s)([a-z])/g, (x, a, c) => a + c.toUpperCase());
    const ids = [];
    [...m[3]].forEach((c, k) => {
        const v = B32.indexOf(c);
        for (let b = 0; b < 5; b++) if (v & (16 >> b)) ids.push(k * 5 + b + 1);
    });
    let x = 0n;
    for (const c of m[4]) x = (x << 5n) | BigInt(B32.indexOf(c));
    return { quiz: +m[1], nc: m[2], name, ids, x };
}
async function verify(r) {
    let x = 0n;
    for (const id of r.ids) {
        const secret = (await sha256(key + "|microtypo" + r.quiz + "|" + id)).slice(0, 32);
        x ^= BigInt("0x" + (await sha256(secret + "|" + r.nc)).slice(0, 13)) & M50;
    }
    return x === r.x;
}

let runId = 0;
async function run() {
    const id = ++runId, code = $("code").value.trim();
    const res = $("result");
    const show = (bad, name, score, quiz) => {
        res.classList.toggle("bad", bad);
        $("r-name").textContent = name; $("r-score").innerHTML = score; $("r-quiz").textContent = quiz;
    };
    if (!code) return show(false, "", "", "");
    if (!keyOk) return show(true, "Clé manquante", "", "");
    const r = readCode(code);
    const ok = r && await verify(r);
    if (id !== runId) return;
    if (!ok) return show(true, "Code invalide", "", "");
    const total = await totalOf(r.quiz);
    if (id !== runId) return;
    const note = total ? (Math.round((1 + 5 * r.ids.length / total) * 10) / 10).toFixed(1).replace(".", ",") : "?";
    // même présentation que l'écran final du quiz
    show(false, r.name,
        "Score" + THIN + ":<br>" + r.ids.length + " / " + (total || "?") + "<br>Note" + THIN + ":<br>" + note,
        "MicroTypo " + r.quiz + " · code valide");
}

$("key").addEventListener("input", e => setKey(e.target.value, false));
$("code").addEventListener("input", run);
try { const k = localStorage.getItem(STORE); if (k) { $("key").value = k; setKey(k, true); } } catch (e) {}
$("code").focus();
})();
</script>
</body>
</html>
