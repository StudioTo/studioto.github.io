title: "StudioTo"
theme: jekyll-theme-primer
plugins:
  - jekyll-redirect-from
  # plugins GitHub Pages par défaut (à lister dès qu'une liste "plugins" existe)
  - jekyll-readme-index          # README.md = page d'index du dossier
  - jekyll-optional-front-matter # .md sans front matter publiés quand même
  - jekyll-relative-links        # liens vers des .md convertis en liens de pages
  - jekyll-titles-from-headings  # titre de page tiré du premier #
  - jekyll-default-layout        # layout du thème appliqué par défaut
