<!--
  Liens : couleur aléatoire au survol, différente à chaque fois.
  Titre du site (StudioTo) : au survol, deux couleurs différentes, une pour « Studio », une pour « To ».
  En-tête collant : mesure sa hauteur (--sticky-top, --sticky-h) ; clic sur le titre de la page :
  retour à la table des matières.
-->
{% if page.url == "/" %}
<!-- accueil : recherche, tri et emoji du tableau d'index -->
<script src="{{ '/assets/js/index-table.js' | relative_url }}" defer></script>
{% endif %}
<script>
  // adresse de la page, pour les styles propres à une page (ex. accueil : data-page="/")
  document.documentElement.setAttribute("data-page", {{ page.url | jsonify }});
</script>
<script>
  (function () {
    var SITE_TITLE = {{ site.title | jsonify }};
    var lastHue = Math.random() * 360;

    function hsl(h) {
      return "hsl(" + Math.round(h % 360) + ", 85%, 45%)";
    }

    // couleur aléatoire, au moins 60° de la précédente pour que le changement se voie
    function randomColor() {
      lastHue = (lastHue + 60 + Math.random() * 240) % 360;
      return hsl(lastHue);
    }

    // ---------- tous les liens (sauf le titre du site)
    // liens, et titre de la page (cliquable : retour à la table des matières)
    function target(e) {
      return e.target.closest && (e.target.closest("a") || e.target.closest("[data-page-title]"));
    }

    function on(e) {
      var a = target(e);
      if (!a || a.hasAttribute("data-site-title") || a.contains(e.relatedTarget)) return;
      a.style.color = randomColor();
    }

    function off(e) {
      var a = target(e);
      if (!a || a.hasAttribute("data-site-title") || a.contains(e.relatedTarget)) return;
      a.style.color = "";
    }

    document.addEventListener("mouseover", on);
    document.addEventListener("mouseout", off);
    document.addEventListener("focusin", on);   // clavier (Tab)
    document.addEventListener("focusout", off);

    // ---------- titre du site : une couleur par partie (Studio / To)
    function setupTitle() {
      var links = document.querySelectorAll("h1 a");
      for (var i = 0; i < links.length; i++) {
        var a = links[i];
        if (a.textContent.trim() !== SITE_TITLE) continue;

        a.setAttribute("data-site-title", "");
        a.setAttribute("aria-label", SITE_TITLE);
        a.textContent = "";
        // découpe à chaque majuscule : "StudioTo" → "Studio" + "To"
        var words = SITE_TITLE.match(/[A-Z][^A-Z]*|[^A-Z]+/g) || [SITE_TITLE];
        var letters = [];
        for (var k = 0; k < words.length; k++) {
          var s = document.createElement("span");
          s.textContent = words[k];
          s.setAttribute("aria-hidden", "true");
          a.appendChild(s);
          letters.push(s);
        }

        function colorize() {
          // une couleur par partie, toutes nettement différentes (réparties sur le cercle)
          var start = Math.random() * 360, step = 360 / letters.length;
          for (var j = 0; j < letters.length; j++) {
            letters[j].style.color = hsl(start + j * step + (Math.random() - 0.5) * step * 0.4);
          }
        }

        function reset() {
          for (var j = 0; j < letters.length; j++) letters[j].style.color = "";
        }

        a.addEventListener("mouseenter", colorize);
        a.addEventListener("mouseleave", reset);
        a.addEventListener("focus", colorize);
        a.addEventListener("blur", reset);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupTitle);
    } else {
      setupTitle();
    }
  })();
</script>
<script>
  // ---------- en-tête collant et titre de page cliquable
  (function () {
    function parts() {
      var body = document.querySelector(".markdown-body");
      var site = body && body.querySelector(":scope > h1:first-child");
      if (!site) return null;
      var next = site.nextElementSibling;
      var title = next && next.tagName === "H1" && document.documentElement.getAttribute("data-page") !== "/" ? next : null;
      return { site: site, title: title, tools: document.querySelector(".index-tools") };
    }

    function measure() {
      var p = parts();
      if (!p) return;
      var top = Math.round(p.site.getBoundingClientRect().height);
      var below = p.title || p.tools;
      var h = top + (below ? Math.round(below.getBoundingClientRect().height) : 0);
      var root = document.documentElement.style;
      root.setProperty("--sticky-top", top + "px");
      root.setProperty("--sticky-h", h + "px");
    }

    function setup() {
      var p = parts();
      if (!p) return;
      if (p.title) {
        p.title.setAttribute("title", "Retour à la table des matières");
        p.title.setAttribute("data-page-title", "");
        p.title.addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        });
      }
      measure();
      window.addEventListener("resize", measure);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      setTimeout(measure, 500);  // la barre de recherche de l'accueil est ajoutée par index-table.js
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setup);
    } else {
      setup();
    }
  })();
</script>
